#!name=locket-Tubim
#Shadowrocket Configuration - locket-Tubim

[General]
update-url = https://dinhduyvinh.tech/i/LocketGold_by_duyvinh09_a923f57c9bed844e2b16c5b2a5ab077fb05145caea2875d081136fe2d8f96a4e.sgmodule

[Rule]
AND,((DOMAIN,api.locketcamera.com),(PROTOCOL,UDP),(DEST-PORT,443)),REJECT
AND,((DOMAIN,us-central1-locket-4252a.cloudfunctions.net),(PROTOCOL,UDP),(DEST-PORT,443)),REJECT
AND,((DOMAIN,firebaseremoteconfig.googleapis.com),(PROTOCOL,UDP),(DEST-PORT,443)),REJECT

[URL Rewrite]
^https:\/\/api\.locketcamera\.com\/generateFilteredImage 'https://locket.dinhduyvinh.tech/generateFilteredImage' 307

[Script]
# RevenueCat - script hiện tại
locket_revenuecat = type=http-response, pattern=^https:\/\/api\.revenuecat\.com\/.+\/(receipts|subscribers), script-path=https://raw.githubusercontent.com/btuuuad/locketfilter/refs/heads/main/btuuuad.js, requires-body=true, max-size=-1, timeout=60

# Xóa header cache
locket_delete_header = type=http-request, pattern=^https:\/\/(api\.revenuecat\.com|firebaseremoteconfig\.googleapis\.com)\/.+, script-path=https://raw.githubusercontent.com/btuuuad/locketfilter/refs/heads/main/delete.js, timeout=60

# Firebase Remote Config
locket_unlocked = type=http-response, pattern=^https:\/\/firebaseremoteconfig\.googleapis\.com\/.+, script-path=https://raw.githubusercontent.com/btuuuad/locketfilter/refs/heads/main/loket1.js?widget_frame=https%3A%2F%2Fi.ibb.co%2F1Yt1Dzzy%2FShin-chan-1.png, requires-body=true, max-size=-1, timeout=60

# AI Filter / Photobooth
locket_filters = type=http-request, pattern=^https:\/\/(api\.locketcamera\.com|us-central1-locket-4252a\.cloudfunctions\.net)\/(?:[^?#]*\/)?generateFilteredImage(?:\?.*)?$, script-path=https://raw.githubusercontent.com/btuuuad/locketfilter/refs/heads/main/fillter.js, requires-body=true, max-size=-1, timeout=120

# Quote / Breaking News captions
locket_captions = type=http-request, pattern=^https:\/\/(api\.locketcamera\.com|us-central1-locket-4252a\.cloudfunctions\.net)\/(?:[^?#]*\/)?generateCaption(?:\?.*)?$, script-path=https://raw.githubusercontent.com/btuuuad/locketfilter/refs/heads/main/fillter.js, requires-body=true, max-size=-1, timeout=35

[MITM]
hostname = %APPEND% api.locketcamera.com, us-central1-locket-4252a.cloudfunctions.net, firebaseremoteconfig.googleapis.com, api.revenuecat.com
